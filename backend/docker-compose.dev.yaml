version: "3.8"

services:
  db:
    image: postgis/postgis:13-3.1-alpine
    restart: always
    environment:
      POSTGRES_USER: local
      POSTGRES_PASSWORD: local
      POSTGRES_DB: backend
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "local", "-d", "backend" ]
      interval: 5s
      timeout: 2s
      retries: 5
    command: postgres -c listen_addresses='*'
    # 127.0.0.1 ONLY. Published as "5432:5432" this was reachable from the
    # public internet, and the credentials are three lines below in this same
    # committed file. Docker publishes ports by writing iptables rules that
    # BYPASS ufw, so a host firewall would not have covered this — the bind
    # address is the fix.
    #
    # Nothing needs the published port: web, migrate, location-ingest and
    # daily-tasks all reach the database as `db:5432` over the `proxy`
    # network. Keeping it on loopback rather than deleting it preserves
    # admin access over an SSH tunnel:
    #   ssh -L 5432:127.0.0.1:5432 root@<droplet>
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - proxy

  migrate:
    image: ghcr.io/albardn2/karma-backend:latest-dev
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["alembic", "upgrade", "head"]
    environment:
      SQLALCHEMY_DATABASE_URI: "postgresql://local:local@db:5432/backend"
    networks:
      - proxy

  web:
    image: ghcr.io/albardn2/karma-backend:latest-dev
    restart: always
    depends_on:
      - db
    # Caddy reverse-proxies to this service inside the network
    expose:
      - "5000"
    environment:
      SQLALCHEMY_DATABASE_URI: "postgresql://local:local@db:5432/backend"
      # JWT signing secret; comes from the droplet-side .env written by the
      # deploy workflow (sourced from GitHub secrets)
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # namespaces the MQTT location topics (karma-grp/location/dev/...)
      KARMA_ENV: dev
    networks:
      - proxy

  location-ingest:
    image: ghcr.io/albardn2/karma-backend:latest-dev
    restart: always
    depends_on:
      - db
    entrypoint: ["python", "-m", "location_ingest"]
    environment:
      SQLALCHEMY_DATABASE_URI: "postgresql://local:local@db:5432/backend"
      KARMA_ENV: dev
      MQTT_BROKER_HOST: broker.emqx.io
      MQTT_BROKER_TCP_PORT: "1883"
    networks:
      - proxy

  # Runs the daily platform jobs: subscription charges and the USD->SYP rate.
  # Same image as the API with a different entrypoint, exactly like location-ingest.
  # One long-lived process that sleeps until 02:00 Damascus; both tasks are
  # idempotent, so `restart: always` re-running a day is harmless.
  daily-tasks:
    image: ghcr.io/albardn2/karma-backend:latest-dev
    restart: always
    depends_on:
      - db
    entrypoint: ["python", "-m", "daily_tasks"]
    environment:
      SQLALCHEMY_DATABASE_URI: "postgresql://local:local@db:5432/backend"
      KARMA_ENV: dev
    networks:
      - proxy

  # The in-app assistant (chat + voice in the web and phone apps). Its own
  # service: a chat turn streams for 10-60 s and would tie up web's gunicorn
  # threads. Caddy routes https://api-dev.../assistant/* here. It calls the API
  # (`web`) with each user's own token, and keeps its history, usage, action log
  # and settings in the same database (tables from `migrate`).
  #
  # ONE replica: an open approval card is held in this process's memory.
  # Off for every company until switched on in Super Admin -> Assistant.
  assistant:
    image: ghcr.io/albardn2/karma-assistant:latest-dev
    restart: always
    depends_on:
      - db
      - web
    expose:
      - "5077"
    environment:
      KARMA_API: "http://web:5000"
      ASSISTANT_DATABASE_URL: "postgresql://local:local@db:5432/backend"
      # from the droplet-side .env written by the deploy workflow (GitHub secret)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # the dev web app; the phone app isn't a browser, so needs no entry
      ASSISTANT_CORS_ORIGINS: "https://crm-dev.karma-grp.com"
    networks:
      - proxy

  caddy:
    image: caddy:latest
    restart: always
    depends_on:
      - web
      - assistant
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_HOST: api-dev.karma-grp.com
      EMAIL: zaid.bardan@gmail.com
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  proxy:
    driver: bridge
