version: '3.8'
services:
  db:
    image: postgis/postgis:13-3.1-alpine
    # Cap the json-file log. Docker's default driver grows without bound, and
    # this droplet's known failure mode is filling up — a full disk makes
    # `compose pull` fail and `up` silently re-run the stale image. The
    # gunicorn access log this change switches on writes a line per request,
    # which is exactly the kind of steady drip that gets there.
    # 30 MB per service, measured against 1.7 MB of total container logs and
    # 50 GB free today, so this is a ceiling rather than a constraint.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    environment:
      POSTGRES_USER: local
      POSTGRES_PASSWORD: local
      POSTGRES_DB: backend
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "local", "-d", "backend" ]
      interval: 5s
      timeout: 2s
      retries: 5
    # Observability only — NO statement/lock timeouts here. Those are set
    # per-session by the web service (PG_SESSION_OPTIONS below) so that
    # alembic during a deploy, the hourly location purge and the nightly
    # tasks are not killed mid-flight by a limit meant for API requests.
    #
    # pg_stat_statements is the one that ends the guessing: without it there
    # is no record anywhere of which query was slow, when, or how often.
    # After the first deploy that picks this up, run once:
    #   CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
    command: >
      postgres
      -c listen_addresses='*'
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c log_min_duration_statement=500
      -c log_lock_waits=on
      -c log_checkpoints=on
    # 127.0.0.1 ONLY. Published as "5432:5432" this was reachable from the
    # public internet, and the credentials are three lines below in this same
    # committed file. Docker publishes ports by writing iptables rules that
    # BYPASS ufw, so a host firewall would not have covered this — the bind
    # address is the fix.
    #
    # Nothing needs the published port: web, migrate, location-ingest and
    # daily-tasks all reach the database as `db:5432` over the `proxy`
    # network. Keeping it on loopback rather than deleting it preserves
    # admin access over an SSH tunnel:
    #   ssh -L 5432:127.0.0.1:5432 root@<droplet>
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - proxy

  migrate:
    image: ghcr.io/albardn2/karma-backend:latest-prod
    # Cap the json-file log. Docker's default driver grows without bound, and
    # this droplet's known failure mode is filling up — a full disk makes
    # `compose pull` fail and `up` silently re-run the stale image. The
    # gunicorn access log this change switches on writes a line per request,
    # which is exactly the kind of steady drip that gets there.
    # 30 MB per service, measured against 1.7 MB of total container logs and
    # 50 GB free today, so this is a ceiling rather than a constraint.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["alembic", "upgrade", "head"]
    environment:
      SQLALCHEMY_DATABASE_URI: "postgresql://local:local@db:5432/backend"
      VIRTUAL_HOST: ${APP_HOST}
      LETSENCRYPT_HOST: ${APP_HOST}
      LETSENCRYPT_EMAIL: ${EMAIL}
    networks:
      - proxy

  web:
    image: ghcr.io/albardn2/karma-backend:latest-prod
    # Cap the json-file log. Docker's default driver grows without bound, and
    # this droplet's known failure mode is filling up — a full disk makes
    # `compose pull` fail and `up` silently re-run the stale image. The
    # gunicorn access log this change switches on writes a line per request,
    # which is exactly the kind of steady drip that gets there.
    # 30 MB per service, measured against 1.7 MB of total container logs and
    # 50 GB free today, so this is a ceiling rather than a constraint.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    depends_on:
      - db
    # 127.0.0.1 ONLY. Published as "5000:5000" the API answered in PLAIN
    # HTTP on the droplet's public IP, bypassing nginx-proxy and TLS
    # entirely — so a JWT sent to it travelled unencrypted.
    #
    # nginx-proxy does not use this port: it discovers the container through
    # docker.sock and connects to VIRTUAL_PORT over the `proxy` network.
    # docker-compose.dev.yaml proves the pattern — its web service publishes
    # nothing at all (`expose: "5000"`) and api-dev serves fine.
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      SQLALCHEMY_DATABASE_URI: "postgresql://local:local@db:5432/backend"
      # Applied to API sessions ONLY — this service, not the workers and not
      # alembic. Nothing in the database could previously self-heal: a stuck
      # query or a lock wait blocked a request forever, and an API request
      # that has run for 30s has already lost the user.
      PG_SESSION_OPTIONS: "-c statement_timeout=30000 -c lock_timeout=5000 -c idle_in_transaction_session_timeout=60000"
      # Abort a worker whose request has wedged. Under gthread gunicorn's
      # --timeout only notices a dead WORKER, not a stuck request, so a pure
      # CPU loop would hold its thread forever. 120s sits above the slowest
      # legitimate request (trip routing against a degraded OSRM: 48s of
      # outbound calls, plus clustering and the database) — raise
      # saleman_router's budget and this must move with it.
      REQUEST_WATCHDOG_SECONDS: "120"
      # JWT signing secret; comes from the droplet-side .env written by the
      # deploy workflow (sourced from GitHub secrets)
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # namespaces the MQTT location topics (karma-grp/location/prod/...);
      # same broker host as dev, different topic prefix
      KARMA_ENV: prod
      # Proxy & Let's Encrypt settings:
      VIRTUAL_HOST: ${APP_HOST}
      LETSENCRYPT_HOST: ${APP_HOST}
      LETSENCRYPT_EMAIL: ${EMAIL}
      VIRTUAL_PORT: 5000
    networks:
      - proxy

  location-ingest:
    image: ghcr.io/albardn2/karma-backend:latest-prod
    # Cap the json-file log. Docker's default driver grows without bound, and
    # this droplet's known failure mode is filling up — a full disk makes
    # `compose pull` fail and `up` silently re-run the stale image. The
    # gunicorn access log this change switches on writes a line per request,
    # which is exactly the kind of steady drip that gets there.
    # 30 MB per service, measured against 1.7 MB of total container logs and
    # 50 GB free today, so this is a ceiling rather than a constraint.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    depends_on:
      - db
    entrypoint: ["python", "-m", "location_ingest"]
    environment:
      SQLALCHEMY_DATABASE_URI: "postgresql://local:local@db:5432/backend"
      KARMA_ENV: prod
      MQTT_BROKER_HOST: broker.emqx.io
      MQTT_BROKER_TCP_PORT: "1883"
    networks:
      - proxy

  # Runs the daily platform jobs: subscription charges and the USD->SYP rate.
  # Same image as the API with a different entrypoint, exactly like location-ingest.
  # One long-lived process that sleeps until 02:00 Damascus; both tasks are
  # idempotent, so `restart: always` re-running a day is harmless.
  daily-tasks:
    image: ghcr.io/albardn2/karma-backend:latest-prod
    # Cap the json-file log. Docker's default driver grows without bound, and
    # this droplet's known failure mode is filling up — a full disk makes
    # `compose pull` fail and `up` silently re-run the stale image. The
    # gunicorn access log this change switches on writes a line per request,
    # which is exactly the kind of steady drip that gets there.
    # 30 MB per service, measured against 1.7 MB of total container logs and
    # 50 GB free today, so this is a ceiling rather than a constraint.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    depends_on:
      - db
    entrypoint: ["python", "-m", "daily_tasks"]
    environment:
      SQLALCHEMY_DATABASE_URI: "postgresql://local:local@db:5432/backend"
      KARMA_ENV: prod
    networks:
      - proxy

  nginx-proxy:
    image: jwilder/nginx-proxy
    # Cap the json-file log. Docker's default driver grows without bound, and
    # this droplet's known failure mode is filling up — a full disk makes
    # `compose pull` fail and `up` silently re-run the stale image. The
    # gunicorn access log this change switches on writes a line per request,
    # which is exactly the kind of steady drip that gets there.
    # 30 MB per service, measured against 1.7 MB of total container logs and
    # 50 GB free today, so this is a ceiling rather than a constraint.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    container_name: nginx-proxy  # Optional, for easier reference
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
    networks:
      - proxy

  letsencrypt:
    image: jrcs/letsencrypt-nginx-proxy-companion
    # Cap the json-file log. Docker's default driver grows without bound, and
    # this droplet's known failure mode is filling up — a full disk makes
    # `compose pull` fail and `up` silently re-run the stale image. The
    # gunicorn access log this change switches on writes a line per request,
    # which is exactly the kind of steady drip that gets there.
    # 30 MB per service, measured against 1.7 MB of total container logs and
    # 50 GB free today, so this is a ceiling rather than a constraint.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    depends_on:
      - nginx-proxy
    environment:
      NGINX_PROXY_CONTAINER: nginx-proxy  # or just "nginx-proxy" if you’ve overridden container_name
#      ACME_CA_URI: https://acme-staging-v02.api.letsencrypt.org/directory
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
    networks:
      - proxy

volumes:
  postgres_data:
  certs:
  vhost:
  html:

networks:
  proxy:
    driver: bridge