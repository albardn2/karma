version: '3.8'
services:
  db:
    image: postgis/postgis:13-3.1-alpine
    restart: always
    environment:
      POSTGRES_USER: local
      POSTGRES_PASSWORD: local
      POSTGRES_DB: backend
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "local", "-d", "backend" ]
      interval: 5s
      timeout: 2s
      retries: 5
    command: postgres -c listen_addresses='*'
    # 127.0.0.1 ONLY. Published as "5432:5432" this was reachable from the
    # public internet, and the credentials are three lines below in this same
    # committed file. Docker publishes ports by writing iptables rules that
    # BYPASS ufw, so a host firewall would not have covered this — the bind
    # address is the fix.
    #
    # Nothing needs the published port: web, migrate, location-ingest and
    # daily-tasks all reach the database as `db:5432` over the `proxy`
    # network. Keeping it on loopback rather than deleting it preserves
    # admin access over an SSH tunnel:
    #   ssh -L 5432:127.0.0.1:5432 root@<droplet>
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - proxy

  migrate:
    image: ghcr.io/albardn2/karma-backend:latest-prod
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["alembic", "upgrade", "head"]
    environment:
      SQLALCHEMY_DATABASE_URI: "postgresql://local:local@db:5432/backend"
      VIRTUAL_HOST: ${APP_HOST}
      LETSENCRYPT_HOST: ${APP_HOST}
      LETSENCRYPT_EMAIL: ${EMAIL}
    networks:
      - proxy

  web:
    image: ghcr.io/albardn2/karma-backend:latest-prod
    restart: always
    depends_on:
      - db
    # 127.0.0.1 ONLY. Published as "5000:5000" the API answered in PLAIN
    # HTTP on the droplet's public IP, bypassing nginx-proxy and TLS
    # entirely — so a JWT sent to it travelled unencrypted.
    #
    # nginx-proxy does not use this port: it discovers the container through
    # docker.sock and connects to VIRTUAL_PORT over the `proxy` network.
    # docker-compose.dev.yaml proves the pattern — its web service publishes
    # nothing at all (`expose: "5000"`) and api-dev serves fine.
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      SQLALCHEMY_DATABASE_URI: "postgresql://local:local@db:5432/backend"
      # JWT signing secret; comes from the droplet-side .env written by the
      # deploy workflow (sourced from GitHub secrets)
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # namespaces the MQTT location topics (karma-grp/location/prod/...);
      # same broker host as dev, different topic prefix
      KARMA_ENV: prod
      # Proxy & Let's Encrypt settings:
      VIRTUAL_HOST: ${APP_HOST}
      LETSENCRYPT_HOST: ${APP_HOST}
      LETSENCRYPT_EMAIL: ${EMAIL}
      VIRTUAL_PORT: 5000
    networks:
      - proxy

  location-ingest:
    image: ghcr.io/albardn2/karma-backend:latest-prod
    restart: always
    depends_on:
      - db
    entrypoint: ["python", "-m", "location_ingest"]
    environment:
      SQLALCHEMY_DATABASE_URI: "postgresql://local:local@db:5432/backend"
      KARMA_ENV: prod
      MQTT_BROKER_HOST: broker.emqx.io
      MQTT_BROKER_TCP_PORT: "1883"
    networks:
      - proxy

  # Runs the daily platform jobs: subscription charges and the USD->SYP rate.
  # Same image as the API with a different entrypoint, exactly like location-ingest.
  # One long-lived process that sleeps until 02:00 Damascus; both tasks are
  # idempotent, so `restart: always` re-running a day is harmless.
  daily-tasks:
    image: ghcr.io/albardn2/karma-backend:latest-prod
    restart: always
    depends_on:
      - db
    entrypoint: ["python", "-m", "daily_tasks"]
    environment:
      SQLALCHEMY_DATABASE_URI: "postgresql://local:local@db:5432/backend"
      KARMA_ENV: prod
    networks:
      - proxy

  nginx-proxy:
    image: jwilder/nginx-proxy
    restart: always
    container_name: nginx-proxy  # Optional, for easier reference
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
    networks:
      - proxy

  letsencrypt:
    image: jrcs/letsencrypt-nginx-proxy-companion
    restart: always
    depends_on:
      - nginx-proxy
    environment:
      NGINX_PROXY_CONTAINER: nginx-proxy  # or just "nginx-proxy" if you’ve overridden container_name
#      ACME_CA_URI: https://acme-staging-v02.api.letsencrypt.org/directory
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
    networks:
      - proxy

volumes:
  postgres_data:
  certs:
  vhost:
  html:

networks:
  proxy:
    driver: bridge