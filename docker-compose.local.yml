# Local full-stack preview: Postgres (PostGIS) + Flask backend + assistant + React/Vite frontend.
#
#   docker compose -f docker-compose.local.yml up --build
#
# Then open http://localhost:3000 and log in with admin / admin.
# The browser loads the SPA from :3000 and calls the Flask API directly at :5000
# (Flask CORS is open; JWT travels in the Authorization header).
services:
  db:
    image: postgis/postgis:13-3.1-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: local
      POSTGRES_PASSWORD: local
      POSTGRES_DB: backend
    command: postgres -c listen_addresses='*'
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "local", "-d", "backend"]
      interval: 5s
      timeout: 2s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - karma_pg_data:/var/lib/postgresql/data

  # Builds the backend image (reused by seed + backend) and applies migrations, then exits.
  backend-migrate:
    build:
      context: ./backend
    image: karma-backend:local
    command: ["sh", "-c", "python scripts/wait_for_db.py && alembic upgrade head"]
    environment:
      SQLALCHEMY_DATABASE_URI: "postgresql://local:local@db:5432/backend"
    depends_on:
      db:
        condition: service_healthy

  # Creates a local admin user (idempotent) so login works on a fresh DB.
  backend-seed:
    image: karma-backend:local
    command: ["sh", "-c", "python scripts/wait_for_db.py && python scripts/seed_admin.py"]
    environment:
      SQLALCHEMY_DATABASE_URI: "postgresql://local:local@db:5432/backend"
      PYTHONPATH: /karma
      SEED_ADMIN_USERNAME: admin
      SEED_ADMIN_PASSWORD: admin
    depends_on:
      backend-migrate:
        condition: service_completed_successfully

  backend:
    image: karma-backend:local
    restart: unless-stopped
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "--reload", "run:app"]
    # Mount the source, or --reload above is a lie: gunicorn watches files
    # inside the image, which only change when the image is rebuilt. Without
    # this the local API silently serves whatever the image was built from —
    # it sat five days behind the checkout, and a bug that had already been
    # fixed and deployed still reproduced locally. The frontend service below
    # has always mounted its source; this is the missing half.
    volumes:
      - ./backend:/karma
    environment:
      SQLALCHEMY_DATABASE_URI: "postgresql://local:local@db:5432/backend"
      JWT_SECRET_KEY: "local-dev-only-not-a-secret"
    ports:
      - "5000:5000"
    depends_on:
      backend-seed:
        condition: service_completed_successfully

  # The in-app assistant (chat + voice for the web and phone apps). Its own
  # service: a chat turn streams for 10-60 s and would tie up the API's few
  # gunicorn threads. It calls the API with each user's own token, so tenant
  # scoping and permissions apply unchanged.
  #
  # Needs an Anthropic key: put ANTHROPIC_API_KEY=... in a .env file next to
  # this compose file (gitignored; compose reads it). Without one the service
  # still starts and the chat answers that the model isn't configured.
  #
  # It is off for every company until switched on in Super Admin -> Assistant
  # (one switch for all companies, or per company).
  assistant:
    build:
      context: ./backend
      dockerfile: assistant/Dockerfile
    image: karma-assistant:local
    restart: unless-stopped
    environment:
      KARMA_API: "http://backend:5000"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # history, usage, action log and settings: Karma's database (tables from
      # the API's migrations)
      ASSISTANT_DATABASE_URL: "postgresql://local:local@db:5432/backend"
      # the web app's origin (the phone app isn't a browser, so needs none)
      ASSISTANT_CORS_ORIGINS: "http://localhost:3000,http://localhost:3001"
    volumes:
      # source mounted so a restart picks up edits without a rebuild
      - ./backend/assistant:/app/assistant
    ports:
      - "5077:5077"
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      # Read by the browser; must be reachable from the host, not the docker network.
      VITE_API_BASE_URL: "http://localhost:5000"
      VITE_ASSISTANT_URL: "http://localhost:5077"
    ports:
      - "3000:5000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  karma_pg_data:

