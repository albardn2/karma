# Gives the DEV droplet a 2 GB swap file (idempotent: does nothing if one exists).
#
# WHY. The dev droplet has 1 vCPU, 960 MB RAM and no swap. Measured on
# 2026-11-20 (droplet-diagnostics.yml): 61 MB available, load average 43, the
# API timing out — every out-of-memory moment killed a process outright.
# Swap turns that into slowness instead of crashes. It is not a substitute for
# more RAM; resize the droplet for that.
#
# Runs on a push that changes this file on the assistant branch (a new
# workflow can't be started by hand until it is on main), or by hand once it is.
# Dev only: it never reads the prod secrets.
name: OPS – Dev droplet swap

on:
  push:
    branches:
      - feat/assistant-spike
    paths:
      - .github/workflows/ops-dev-swap.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swap:
    name: Add swap on the dev droplet
    runs-on: ubuntu-latest
    steps:
      - name: Create and enable /swapfile
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.DEV_DROPLET_HOST }}
          username: root
          password: ${{ secrets.DEV_DROPLET_PASSWORD }}
          port: 22
          command_timeout: 20m
          script: |
            set -e
            echo "before:"; free -m
            if swapon --show | grep -q '^/swapfile'; then
              echo "/swapfile is already on; nothing to do"
            else
              if [ ! -f /swapfile ]; then
                fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048
                chmod 600 /swapfile
                mkswap /swapfile
              fi
              swapon /swapfile
            fi
            # survive reboots
            grep -q '^/swapfile ' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
            # use swap as overflow, not as a first resort
            echo 'vm.swappiness=10' > /etc/sysctl.d/99-karma-swap.conf
            sysctl -p /etc/sysctl.d/99-karma-swap.conf
            echo "after:"; free -m; swapon --show
