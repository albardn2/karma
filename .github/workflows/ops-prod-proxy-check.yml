# One-off, READ-ONLY: which nginx-proxy is prod running, and does its template
# support VIRTUAL_PATH (path-based routing)? Decides whether the assistant can
# live at api-prod.karma-grp.com/assistant instead of needing its own hostname.
# Nothing here starts, stops, pulls, writes or prunes. Delete after use.
name: OPS – Prod proxy check (read-only)

on:
  push:
    branches:
      - feat/assistant-spike
    paths:
      - .github/workflows/ops-prod-proxy-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read nginx-proxy facts
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.PROD_DROPLET_HOST }}
          username: root
          password: ${{ secrets.PROD_DROPLET_PASSWORD }}
          port: 22
          script: |
            echo "image:"; docker inspect nginx-proxy --format '{{.Config.Image}} {{.Image}}'
            echo "image created:"; docker image inspect "$(docker inspect nginx-proxy --format '{{.Image}}')" --format '{{.Created}}'
            echo "version env:"; docker inspect nginx-proxy --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -i -E "VERSION" || echo "  (none)"
            echo "template mentions VIRTUAL_PATH:"; docker exec nginx-proxy sh -c 'grep -c VIRTUAL_PATH /app/nginx.tmpl' || echo "  0 / no template"
            echo "template mentions VIRTUAL_DEST:"; docker exec nginx-proxy sh -c 'grep -c VIRTUAL_DEST /app/nginx.tmpl' || echo "  0"
            echo "nginx version:"; docker exec nginx-proxy nginx -v 2>&1
            echo "docker-gen version:"; docker exec nginx-proxy docker-gen -version 2>&1 || true
